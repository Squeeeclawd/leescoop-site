<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Forever Motown event cover</title>
  <desc id="desc">A retro concert-style abstract cover with stage lights, microphones, and Gulf Coast colors.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#063A52"/>
      <stop offset="0.45" stop-color="#07506F"/>
      <stop offset="1" stop-color="#197894"/>
    </linearGradient>
    <radialGradient id="glow-orange" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#F28B42" stop-opacity="0.75"/>
      <stop offset="0.45" stop-color="#D94B32" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#D94B32" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-yellow" cx="50%" cy="50%" r="52%">
      <stop offset="0" stop-color="#F7DE69" stop-opacity="0.72"/>
      <stop offset="0.45" stop-color="#F28B42" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#F28B42" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2.4" fill="#8BD2DE" opacity="0.22"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)" opacity="0.45"/>

  <circle cx="360" cy="220" r="310" fill="url(#glow-orange)" filter="url(#soft)"/>
  <circle cx="1230" cy="190" r="280" fill="url(#glow-yellow)" filter="url(#soft)"/>
  <circle cx="850" cy="760" r="420" fill="#4FA7BC" opacity="0.18" filter="url(#soft)"/>

  <path d="M0 690 C240 625 378 725 596 655 C823 583 1015 644 1180 612 C1362 576 1472 646 1600 610 L1600 900 L0 900 Z" fill="#031A25" opacity="0.72"/>
  <path d="M0 738 C236 680 397 760 610 706 C837 648 1016 694 1212 672 C1401 650 1509 704 1600 688" fill="none" stroke="#8BD2DE" stroke-width="8" opacity="0.62"/>
  <path d="M0 782 C259 722 416 803 646 748 C854 698 1027 739 1228 720 C1414 702 1510 750 1600 734" fill="none" stroke="#F7DE69" stroke-width="5" opacity="0.54"/>

  <!-- stage lights -->
  <g opacity="0.88">
    <path d="M252 96 L420 656" stroke="#F28B42" stroke-width="34" stroke-linecap="round" opacity="0.18"/>
    <path d="M584 74 L685 650" stroke="#F7DE69" stroke-width="28" stroke-linecap="round" opacity="0.16"/>
    <path d="M1032 70 L905 650" stroke="#8BD2DE" stroke-width="30" stroke-linecap="round" opacity="0.15"/>
    <path d="M1356 108 L1138 656" stroke="#F28B42" stroke-width="32" stroke-linecap="round" opacity="0.15"/>
  </g>

  <!-- abstract microphones -->
  <g transform="translate(0 10)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(355 348) rotate(-10)">
      <rect x="-38" y="-92" width="76" height="142" rx="38" fill="#F8F3E8" opacity="0.96"/>
      <path d="M-48 -20 C-48 64 48 64 48 -20" stroke="#F8F3E8" stroke-width="16"/>
      <path d="M0 64 L0 210" stroke="#F8F3E8" stroke-width="18"/>
      <path d="M-70 210 L70 210" stroke="#F8F3E8" stroke-width="18"/>
      <path d="M-20 -60 L20 -60 M-24 -26 L24 -26 M-18 8 L18 8" stroke="#063A52" stroke-width="9" opacity="0.75"/>
    </g>
    <g transform="translate(1218 360) rotate(11) scale(0.92)">
      <rect x="-38" y="-92" width="76" height="142" rx="38" fill="#F8F3E8" opacity="0.9"/>
      <path d="M-48 -20 C-48 64 48 64 48 -20" stroke="#F8F3E8" stroke-width="16"/>
      <path d="M0 64 L0 210" stroke="#F8F3E8" stroke-width="18"/>
      <path d="M-70 210 L70 210" stroke="#F8F3E8" stroke-width="18"/>
      <path d="M-20 -60 L20 -60 M-24 -26 L24 -26 M-18 8 L18 8" stroke="#063A52" stroke-width="9" opacity="0.75"/>
    </g>
  </g>

  <!-- record/soul motif -->
  <g transform="translate(800 420)">
    <circle r="190" fill="#031A25" opacity="0.78"/>
    <circle r="146" fill="none" stroke="#4FA7BC" stroke-width="6" opacity="0.48"/>
    <circle r="104" fill="none" stroke="#8BD2DE" stroke-width="5" opacity="0.42"/>
    <circle r="58" fill="#F28B42" opacity="0.92"/>
    <circle r="18" fill="#F8F3E8" opacity="0.96"/>
  </g>

  <g opacity="0.26" fill="#F8F3E8">
    <circle cx="230" cy="595" r="10"/>
    <circle cx="277" cy="548" r="7"/>
    <circle cx="1370" cy="558" r="9"/>
    <circle cx="1322" cy="609" r="6"/>
    <circle cx="1014" cy="256" r="7"/>
    <circle cx="515" cy="250" r="6"/>
  </g>

  <rect x="56" y="56" width="1488" height="788" rx="42" fill="none" stroke="#F8F3E8" stroke-width="3" opacity="0.18"/>
</svg>
